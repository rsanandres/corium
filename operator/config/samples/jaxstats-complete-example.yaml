---
# Demo workload - nginx pods to be monitored
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
  namespace: default
  labels:
    app: demo-workload
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-workload
  template:
    metadata:
      labels:
        app: demo-workload
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
---
# JAXStatsConfig - Global configuration
apiVersion: stats.corium.io/v1alpha1
kind: JAXStatsConfig
metadata:
  name: production-config
spec:
  enabled: true
  collectionInterval: 30
  metrics:
    - "restart_count"
    - "not_ready_count"
    - "pod_count"
    - "container_count"
  storageConfig:
    type: "configmap"
---
# JAXStatsCollector - Monitor demo workload pods
apiVersion: stats.corium.io/v1alpha1
kind: JAXStatsCollector
metadata:
  name: workload-collector
spec:
  targetNamespace: "default"
  configRef: "production-config"
  metrics:
    - "restart_count"
    - "not_ready_count"
    - "pod_count"
  resourceTypes:
    - "pods"
  selector:
    matchLabels:
      app: demo-workload
  collectionSchedule: "*/1 * * * *"
---
# JAXStatsAlert - Alert on pod health issues
apiVersion: stats.corium.io/v1alpha1
kind: JAXStatsAlert
metadata:
  name: workload-alerts
spec:
  enabled: true
  collectorRef: "workload-collector"
  cooldownPeriod: "5m"
  rules:
    - name: "high-restart-count"
      metric: "restart_count"
      operator: ">"
      threshold: "5"
      severity: "warning"
    - name: "pods-not-ready"
      metric: "not_ready_count"
      operator: ">"
      threshold: "0"
      severity: "critical"
    - name: "too-few-pods"
      metric: "pod_count"
      operator: "<"
      threshold: "2"
      severity: "warning"
  notifications:
    - type: "event"
