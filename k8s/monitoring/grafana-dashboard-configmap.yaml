apiVersion: v1
kind: ConfigMap
metadata:
  name: corium-operator-dashboard
  namespace: corium-monitoring
  labels:
    grafana_dashboard: "1"
data:
  corium-operator-dashboard.json: |
    {
      "annotations": { "list": [] },
      "description": "Corium Operator - JAXStats Controller Metrics",
      "editable": true,
      "panels": [
        {
          "title": "Reconciliation Errors by Controller",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "rate(jaxstats_reconcile_errors_total[5m])", "legendFormat": "{{controller}}" }],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2 } } }
        },
        {
          "title": "Discovered Pods by Collector",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "jaxstats_discovered_pods", "legendFormat": "{{collector}}" }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "green", "value": 3 }] } } }
        },
        {
          "title": "Active Alerts",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "jaxstats_active_alerts", "legendFormat": "{{alert}}" }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 3 }] }, "max": 10 } }
        },
        {
          "title": "Discovered Pods Over Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "jaxstats_discovered_pods", "legendFormat": "{{collector}}" }],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2 } } }
        },
        {
          "title": "Controller Work Queue Depth",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "workqueue_depth{namespace=\"corium-operator-system\"}", "legendFormat": "{{name}}" }],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2 } } }
        },
        {
          "title": "Controller Reconcile Duration (p99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "histogram_quantile(0.99, rate(controller_runtime_reconcile_time_seconds_bucket{namespace=\"corium-operator-system\"}[5m]))", "legendFormat": "{{controller}} p99" }],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "s", "custom": { "fillOpacity": 10, "lineWidth": 2 } } }
        }
      ],
      "schemaVersion": 39,
      "tags": ["corium", "operator", "jaxstats"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "Corium Operator Dashboard",
      "uid": "corium-operator",
      "version": 1
    }
