# Default deny ingress for operator namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: corium-operator-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default deny ingress for workloads namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: corium-workloads
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default deny ingress for monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: corium-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow Prometheus (monitoring namespace) to scrape operator metrics on :8443
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-operator
  namespace: corium-operator-system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: corium-monitoring
      ports:
        - port: 8443
          protocol: TCP
---
# Allow Grafana to query Prometheus within monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-prometheus
  namespace: corium-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9090
          protocol: TCP
---
# Allow intra-namespace traffic in workloads (pods talking to each other)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: corium-workloads
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
